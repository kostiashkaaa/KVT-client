[package]
name = "kvt-core"
description = "Модель, парсеры подписок, маршрутизация и сетевой диспетчер KVT"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64.workspace = true
percent-encoding.workspace = true
# DoH для имён серверов при проверке (`dns::names`). Schannel, как у окна и службы.
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "native-tls-alpn", "http2"] }
# Распознавание QR-кода на картинке (`qr`): чистый Rust, без сети; картинку в яркости
# отдаёт окно, поэтому декодеры изображений (feature `img`) не нужны.
rqrr = { version = "0.11", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
proptest.workspace = true
# Рисует QR-коды для тестов распознавания; в сборку не входит.
qrcode = { version = "0.15", default-features = false }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
