[package]
name = "kvt-service"
description = "Привилегированная служба KVT: запуск ядер с TUN, zapret, kill switch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
kvt-core.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Schannel: TLS-отпечаток системы Windows.
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "http2"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Rpc",
    "Win32_System_Threading",
] }

[lints]
workspace = true
