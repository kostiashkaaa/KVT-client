<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Аватар канала: Telegram обрезает его кругом, поэтому фон без скруглений, а знак чуть крупнее,
       чем в иконке приложения. Самая дальняя точка знака — в ~490 из 512 единиц радиуса. -->
  <rect width="1024" height="1024" fill="#005fb8"/>
  <g transform="translate(512 512) scale(1.15) translate(-512 -512)">
    <path d="M348 276v472" fill="none" stroke="#fff" stroke-width="104" stroke-linecap="round"/>
    <path d="M706 276 472 512l234 236" fill="none" stroke="#60cdff" stroke-width="104" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
