[package]
name = "kvt-app"
description = "KVT — клиент VPN-подписок для Windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "kvt"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kvt-core.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Архив экспорта диагностики.
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri = { version = "2", features = ["tray-icon"] }
# Второй запуск не падает на занятой папке WebView2, а показывает уже открытое окно.
tauri-plugin-single-instance = "2"
url.workspace = true
# native-tls в Windows — это системный Schannel: TLS-отпечаток как у Edge и
# системных программ, а не редкий отпечаток rustls/ring.
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "native-tls-alpn", "http2", "charset", "socks"] }
# DoT для проверки DNS — тот же системный Schannel, что и у reqwest.
native-tls = "0.2"
tokio-native-tls = "0.3"
sha2.workspace = true
# Секрет установки для ID устройства (X-HWID) — системный генератор.
getrandom = "0.3"
# Чтение баз других клиентов при переносе (v2rayN, Throne, Hiddify). SQLite — в составе.
rusqlite = { version = "0.41", features = ["bundled"] }
# Окно выбора папки для переноса из клиента, который не нашёлся сам.
rfd = { version = "0.17", default-features = false }
# Уведомления Windows (тосты) с откликом на клик — тот же `windows` 0.62, что у Tauri.
tauri-winrt-notification = "0.8"

[dev-dependencies]
# Виртуальное время в тестах ожидания лимитов NetGovernor.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinInet",
    "Win32_Networking_WinSock",
    "Win32_System_JobObjects",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
